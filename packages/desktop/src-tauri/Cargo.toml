[package]
name = "ossia-desktop"
version = "0.0.0"
description = "Ossia — piano score editor with a local engraving engine"
edition = "2021"
rust-version = "1.80"

[lib]
name = "ossia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
