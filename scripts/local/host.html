<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ossia P00 宿主探针</title>
  <link rel="stylesheet" href="/probe.css" />
  <script type="module" src="/probe.js"></script>
  <main>
    <h1>Ossia P00 宿主探针</h1>
    <p id="status" role="status">正在交换临时凭据…</p>
    <p>点击小节，检查本视图的选择和事件流。</p>
    <div id="measures" aria-label="合成小节">
      <button type="button" data-measure="1" aria-pressed="false">小节 1</button>
      <button type="button" data-measure="2" aria-pressed="false">小节 2</button>
      <button type="button" data-measure="3" aria-pressed="false">小节 3</button>
      <button type="button" data-measure="4" aria-pressed="false">小节 4</button>
    </div>
    <p><button id="reconnect" type="button">重新连接事件流</button></p>
    <pre id="state" aria-live="polite"></pre>
    <p id="stream" role="status"></p>
  </main>
</html>
