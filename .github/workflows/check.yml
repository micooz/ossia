name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Check release dependency cache
        id: release-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          lookup-only: true
      - name: Restore and save release dependency cache
        if: steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: pnpm/setup@v3.1.2
        if: steps.release-cache.outputs.cache-hit != 'true'
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          install: false
      - if: steps.release-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Warm release dependencies
        if: steps.release-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ossia/desktop exec tauri build --ci --no-bundle --target "${{ matrix.target }}"

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy
      - uses: pnpm/setup@v3.1.2
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          install: false
      - name: Restore Rust check cache
        id: check-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: check-v1-${{ runner.os }}-${{ matrix.target }}-rust-1.91.0-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            check-v1-${{ runner.os }}-${{ matrix.target }}-rust-1.91.0-${{ hashFiles('**/Cargo.lock') }}-
      - name: Restore release dependency cache
        if: steps.check-cache.outputs.cache-hit != 'true' && steps.check-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:types
      - run: pnpm check:mcp
      - run: pnpm build:ui
      - run: pnpm test:scripts
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins --tests -- --test-threads=1 --skip watcher_debounces_atomic_saves_and_recovers_deleted_file
      - name: Native watcher isolation
        run: cargo test -p ossia-backend --test watch watcher_debounces_atomic_saves_and_recovers_deleted_file -- --test-threads=1
      - name: Save Rust check cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ steps.check-cache.outputs.cache-primary-key }}

  verify-jianpu:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: pnpm/setup@v3.1.2
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Install locked engine
        run: pnpm engine:install
      - name: Verify Jianpu fixtures
        run: pnpm verify:jianpu

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: pnpm/setup@v3.1.2
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Install locked engine
        run: pnpm engine:install
      - name: Verify fixtures
        run: pnpm verify --skip-jianpu
        env:
          OSSIA_AUDITION_OUTPUT: ${{ runner.temp }}/audition-fixtures.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: audition-fixtures
          path: ${{ runner.temp }}/audition-fixtures.json
          if-no-files-found: error
          retention-days: 1

  audition-browser:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: pnpm/setup@v3.1.2
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Install browser test runtime and dependencies
        run: pnpm --filter @ossia/ui exec playwright install --with-deps chrome
      - uses: actions/download-artifact@v8.0.2
        with:
          name: audition-fixtures
          path: ${{ runner.temp }}
      - name: Verify audition fixtures
        run: pnpm --filter @ossia/ui exec playwright test --project=browser --reporter=list tests/score/audition-fixture.browser.spec.ts --shard=${{ matrix.shard }}/4
        env:
          OSSIA_AUDITION_FIXTURES: ${{ runner.temp }}/audition-fixtures.json
      - name: Upload audition failure traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: audition-failures-${{ matrix.shard }}
          path: packages/ui/test-results/browser/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.1.2
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Install browser test runtime
        if: runner.os != 'Linux'
        run: pnpm --filter @ossia/ui exec playwright install chrome
      - name: Install browser test runtime and dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @ossia/ui exec playwright install --with-deps chrome
      - name: Browser regression
        if: runner.os == 'Linux'
        run: pnpm test:ui
      - name: Platform keyboard regression
        if: runner.os != 'Linux'
        run: pnpm --filter @ossia/ui exec playwright test --project=browser --grep @platform-keyboard
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failures-${{ matrix.os }}
          path: packages/ui/test-results/browser/
          if-no-files-found: ignore
          retention-days: 7
