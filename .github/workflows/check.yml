name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      tag:
        description: Release tag whose version should be injected before checks
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Check release dependency cache
        id: release-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          lookup-only: true
      - name: Restore and save release dependency cache
        if: steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: pnpm/action-setup@v4
        if: steps.release-cache.outputs.cache-hit != 'true'
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        if: steps.release-cache.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux' && steps.release-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - if: steps.release-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Warm release dependencies
        if: steps.release-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ossia/desktop exec tauri build --ci --no-bundle --target "${{ matrix.target }}"

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - run: pnpm install --frozen-lockfile
      - name: Inject release version
        if: inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release/version.mjs set "$RELEASE_TAG"
          node scripts/release/version.mjs check "$RELEASE_TAG"
      - run: pnpm check
      - run: pnpm check:types
      - run: pnpm check:contracts
      - run: pnpm typecheck
      - run: pnpm build:web
      - run: pnpm test:package
      - run: pnpm test:release
      - run: pnpm test:engine
      - run: pnpm test:integrations
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install browser test runtime
        if: runner.os == 'Linux'
        run: pnpm --filter @ossia/ui exec playwright install --with-deps chrome
      - name: Browser regression
        if: runner.os == 'Linux'
        run: pnpm test:ui
