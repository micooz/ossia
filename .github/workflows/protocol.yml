name: Local protocol
on:
  pull_request:
  push:
    branches: [main]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p ossia-types --bin generate-types -- --check
      - run: cargo run --locked -p ossia-runtime --bin generate-contracts -- --check
      - run: cargo test --locked -p ossia-runtime
