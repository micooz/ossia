[workspace]
resolver = "2"
members = [
  "crates/ossia-types",
  "crates/ossia-score",
  "crates/ossia-engine",
  "packages/desktop/src-tauri",
]
default-members = ["crates/ossia-types", "crates/ossia-score", "crates/ossia-engine"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }
regex = "1"
quick-xml = "0.42"
